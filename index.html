<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Практика позиционирования</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!--Верстать тут-->
    <section class="logos-section">
    <div class="logo logo-japan">
        <div class="japan-circle"></div>
    </div>

    <div class="logo logo-microsoft">
        <div class="ms-square ms-red"></div>
        <div class="ms-square ms-green"></div>
        <div class="ms-square ms-blue"></div>
        <div class="ms-square ms-yellow"></div>
    </div>
    <button class="open-modal-btn" id="openModalBtn">Открыть модальное окно</button>

<div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
        <button class="modal-close" id="closeModalBtn">&times;</button>
        <h2 class="modal-title">Модальное окно</h2>
        <div class="modal-content" id="modalContent">
            <p>Содержимое модального окна.</p>
        </div>
    </div>
</div>
</section>
    <script src="index.js"></script>
</body>
</html>
